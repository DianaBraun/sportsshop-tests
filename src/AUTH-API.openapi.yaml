---
openapi: 3.0.0
info:
  description: Auth Api Documentation
  version: '1.0'
  title: Auth Api Documentation
  contact: {}
servers:
  - description: SwaggerHub API Auto Mocking
    url: https://virtserver.swaggerhub.com/Observepoint/AuthenticationService/1.0
  - url: https://auth.observepoint.com
    description: Production
  - url: https://auth.observepointstaging.com
    description: Staging
tags:
  - name: account-controller
    description: Account Controller
  - name: login-controller
    description: Login Controller
  - name: integration-controller
    description: Integration Controller
paths:
  "/accounts":
    get:
      tags:
        - account-controller
      summary: getAccounts
      operationId: getAccounts
      parameters:
        - name: subdomain
          in: query
          description: subdomain
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Account"
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
    post:
      tags:
        - account-controller
      summary: Create a new account
      operationId: createAccount
      requestBody:
        description: Account creation details
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateAccountRequest"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Account"
        '400':
          description: Bad request
        '401':
          description: Not authenticated
        '403':
          description: Creating accounts is only accessible by op-admin and above
      deprecated: false
  "/accounts/current":
    get:
      tags:
        - account-controller
      summary: Get information about authenticated user's account
      operationId: getCurrentAccount
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountPreview"
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      deprecated: false
  "/accounts/search":
    parameters:
      - "$ref": "#/components/parameters/PageParam"
      - "$ref": "#/components/parameters/SizeParam"
      - "$ref": "#/components/parameters/SortDescParam"
      - name: sortBy
        in: query
        required: false
        schema:
          "$ref": "#/components/schemas/AccountSortEnum"
    post:
      tags:
        - account-controller
      summary: Get accounts filtered
      operationId: getAccountsFiltered
      requestBody:
        description: Applicable filters
        required: false
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AccountSearchRequest"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountSearchResult"
        '401':
          description: Unauthorized
  "/accounts/{accountId}":
    get:
      tags:
        - account-controller
      summary: getAccount
      operationId: getAccountUsingGET
      parameters:
        - name: accountId
          in: path
          description: accountId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Account"
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
    put:
      tags:
        - account-controller
      summary: updateAccount
      operationId: updateAccountUsingPUT
      requestBody:
        description: account body payload
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Account"
      parameters:
        - name: accountId
          in: path
          description: accountId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
  "/accounts/{accountId}/authenticationconfig":
    get:
      tags:
        - account-controller
      summary: getAuthenticationConfig
      operationId: getAuthenticationConfigUsingGET
      parameters:
        - name: accountId
          in: path
          description: accountId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FullAuthenticationConfig"
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
    post:
      tags:
        - account-controller
      summary: createAuthenticationConfig
      operationId: createAuthenticationConfigUsingPOST
      requestBody:
        description: payload for the authentication config
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/FullAuthenticationConfig"
      parameters:
        - name: accountId
          in: path
          description: accountId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
    put:
      tags:
        - account-controller
      summary: updateAuthenticationConfig
      operationId: updateAuthenticationConfigUsingPUT
      requestBody:
        description: payload for the authentication config
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/FullAuthenticationConfig"
      parameters:
        - name: accountId
          in: path
          description: accountId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
  "/accounts/{accountId}/allow-overages":
    put:
      tags:
        - account-controller
      summary: updateAllowOveragesByAccount
      operationId: updateAllowOveragesByAccount
      requestBody:
        description: payload to update allowOverages
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AllowOveragesRequest"
      parameters:
        - name: accountId
          in: path
          description: accountId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
  "/accounts/{accountId}/data-retention":
    put:
      tags:
        - account-controller
      summary: updateRetentionPolicyByAccount
      operationId: updateRetentionPolicyByAccount
      requestBody:
        description: payload to update retention policy
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateRetentionPolicyRequest"
      parameters:
        - name: accountId
          in: path
          description: accountId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
  "/account/sharing-settings":
    put:
      tags:
        - account-controller
      operationId: UpdateSharingSettings
      summary: Update sharing settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SharingSettingsDTO"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SharingSettingsDTO"
        '401':
          description: UnAuthorized
        '403':
          description: Forbidden
    get:
      tags:
        - account-controller
      operationId: GetSharingSettings
      summary: Get sharing settings
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SharingSettingsDTO"
        '401':
          description: UnAuthorized
        '403':
          description: Forbidden
  "/accounts/logo-search":
    get:
      tags:
        - logo-controller
      summary: Search for a logo
      operationId: searchForLogo
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  "/accounts/{accountId}/logo":
    get:
      tags:
        - logo-controller
      summary: Get logo
      operationId: getExistingLogo
      parameters:
        - "$ref": "#/components/parameters/AccountId"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LogoGetResponse"
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
    post:
      tags:
        - logo-controller
      summary: Set logo
      operationId: setLogo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LogoPostRequestUrl"
          multipart/form-data:
            schema:
              "$ref": "#/components/schemas/LogoPostRequestForm"
      parameters:
        - "$ref": "#/components/parameters/AccountId"
      responses:
        '204':
          description: NO_CONTENT
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  "/login":
    post:
      tags:
        - login-controller
      summary: loginWithOPCredentials
      operationId: loginWithOPCredentialsUsingPOST
      requestBody:
        description: payload of the login credentials
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OPToken"
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
  "/logout":
    post:
      tags:
        - logout-controller
      operationId: Logout
      summary: Invalidate the user token
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
  "/forgot-password":
    post:
      tags:
        - login-controller
      operationId: Forgot password
      summary: Send forgot password request
      requestBody:
        description: payload of the forgot password request
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ForgotPasswordRequest"
      responses:
        '200':
          description: OK
  "/reset-password":
    post:
      tags:
        - login-controller
      operationId: Reset password
      summary: Send reset password request
      requestBody:
        description: payload of the reset password request
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ResetPasswordRequest"
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
  "/signup":
    post:
      tags:
        - signup-controller
      operationId: Signup
      summary: Signup process to create a new account with a primary user and trigger
        marketing webhooks
      requestBody:
        description: payload of the signup request
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SignupRequest"
      responses:
        '204':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
  "/sso/{subdomain}/login":
    get:
      tags:
        - sso-controller
      operationId: Get Insensitive SSO Metadata
      summary: Get Insensitive SSO Metadata
      description: Get Insensitive SSO Metadata
      parameters:
        - in: path
          name: subdomain
          description: subdomain prefix for an SSO account
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BaseAuthenticationConfig"
        '401':
          description: UnAuthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
  "/users":
    get:
      tags:
        - user-controller
      operationId: Get Users
      summary: Get All Users for Account
      description: 'Get all Users for Account

        '
      parameters:
        - in: query
          name: accountId
          schema:
            type: integer
          required: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ArrayOfUsers"
        '400':
          description: Bad Request
        '401':
          description: UnAuthorized
        '403':
          description: Forbidden
  "/users/{userId}":
    get:
      tags:
        - user-controller
      operationId: GetUser
      summary: get User
      description: get a single User
      parameters:
        - in: path
          name: userId
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserResponse"
        '401':
          description: UnAuthorized
        '403':
          description: Forbidden
  "/visitor-login":
    post:
      tags:
        - sharing-controller
      operationId: LoginBySharingAccessToken
      summary: Login visitor user by sharing access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/VisitorLoginRequest"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VisitorLoginResponse"
        '404':
          description: Not Found
        '410':
          description: Sharing token expired
  "/share":
    post:
      tags:
        - sharing-controller
      operationId: CreateSharingLink
      summary: Create sharing link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SharingRequest"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SharingResponse"
        '401':
          description: UnAuthorized
        '403':
          description: Forbidden
  "/shared-links":
    post:
      tags:
        - sharing-controller
      operationId: GetSharingLinks
      summary: Get sharing links
      description: Get all sharing links for Account. Only allowed for users with
        Account Admin or higher permissions
      parameters:
        - "$ref": "#/components/parameters/PageParam"
        - "$ref": "#/components/parameters/SizeParam"
        - "$ref": "#/components/parameters/SortDescParam"
        - in: query
          name: sortBy
          schema:
            "$ref": "#/components/schemas/SharingLinksSortByEnum"
          required: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SharedLinksRequest"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SharedLinksResponse"
        '401':
          description: UnAuthorized
        '403':
          description: Forbidden
  "/shared-links/{sharedItemType}/{sharedItemId}":
    get:
      tags:
        - sharing-controller
      operationId: GetSharingLinksForSharedItem
      summary: Get sharing links for a specific shared item
      parameters:
        - name: sharedItemType
          in: path
          required: true
          deprecated: false
          x-allowEmptyValue: false
          schema:
            "$ref": "#/components/schemas/SharedItemType"
        - name: sharedItemId
          in: path
          required: true
          deprecated: false
          x-allowEmptyValue: false
          schema:
            oneOf:
              - "$ref": "#/components/schemas/SharedItem_RunId"
              - "$ref": "#/components/schemas/SharedItem_SavedReportId"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SharedLinksResponse"
        '401':
          "$ref": "#/components/responses/UnAuthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/shared-links/status":
    patch:
      tags:
        - sharing-controller
      operationId: updateSharedLinksStatus
      summary: Update shared links status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateSharedLinksStatusRequestDTO"
      responses:
        '204':
          description: Successful response
        '401':
          description: UnAuthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
  "/shared-links/{sharedLinkId}/status":
    parameters:
      - "$ref": "#/components/parameters/SharedLinkId"
    patch:
      tags:
        - sharing-controller
      operationId: updateSingleSharedLinkStatus
      summary: Update status of a single shared link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateSharedLinkStatusRequestDTO"
      responses:
        '204':
          description: Status updated successfully
        '401':
          "$ref": "#/components/responses/UnAuthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/shared-links/{sharedLinkId}/send-email":
    parameters:
      - "$ref": "#/components/parameters/SharedLinkId"
    post:
      tags:
        - sharing-controller
      operationId: sendSharedLinkEmails
      summary: Send emails for existing shared link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SendSharedLinkEmailsRequestDTO"
      responses:
        '204':
          description: Emails sent successfully
        '401':
          description: UnAuthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
  "/shared-links/{sharedLinkId}":
    parameters:
      - "$ref": "#/components/parameters/SharedLinkId"
    delete:
      tags:
        - sharing-controller
      operationId: deleteSharedLinkById
      summary: Delete shared link by id
      responses:
        '204':
          description: Deleted successfully
        '401':
          description: UnAuthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
  "/accounts/{accountId}/data-layers":
    get:
      tags:
        - account-controller
      summary: Get Account Data Layers
      description: Endpoint to get data layers for an account
      operationId: getAccountDataLayers
      parameters:
        - "$ref": "#/components/parameters/AccountId"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountDataLayersDTO"
        '401':
          description: Not authenticated
        '403':
          description: Not authorized
        '404':
          description: Account not found
    put:
      tags:
        - account-controller
      summary: Update Account Data Layers
      description: Endpoint to update data layers for an account
      operationId: updateAccountDataLayers
      parameters:
        - "$ref": "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/DataLayersRequest"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountDataLayersDTO"
        '401':
          description: Not authenticated
        '403':
          description: Not authorized - requires Account Admin or higher
        '404':
          description: Account not found
components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
        accountType:
          type: integer
        name:
          type: string
        maxUsers:
          type: integer
        strongPasswordPolicy:
          type: boolean
        subDomainIdentifier:
          type: string
        primaryUser:
          "$ref": "#/components/schemas/User"
        auditPageLimit:
          type: integer
        webJourneyRunLimit:
          type: integer
        isSharingEnabled:
          type: boolean
        partner:
          "$ref": "#/components/schemas/Partner"
        allowOverages:
          type: boolean
        retentionPolicy:
          "$ref": "#/components/schemas/RetentionPolicy"
      title: Account
    AccountId:
      type: integer
      description: Account ID
      minimum: 1
      example: 21
    AccountOveragesResponse_DTO:
      allOf:
        - "$ref": "#/components/schemas/AllowOverages_DTO"
      type: object
      description: Indicates if overages are allowed or restricted by account
      required:
        - accountId
      properties:
        accountId:
          type: integer
    AllowOverages_DTO:
      type: object
      description: Indicates if overages are allowed or restricted
      required:
        - allowOverages
      properties:
        allowOverages:
          type: boolean
          default: true
    AccountPreview:
      type: object
      properties:
        id:
          type: integer
        accountType:
          type: integer
        isSharingEnabled:
          type: boolean
        partner:
          "$ref": "#/components/schemas/Partner"
      title: AccountPreview
    AllowOveragesRequest:
      type: object
      description: Indicates if overages are allowed or restricted
      required:
        - allowOverages
      properties:
        allowOverages:
          type: boolean
          default: true
    BaseAuthenticationConfig:
      type: object
      required:
        - authenticationType
      properties:
        authenticationType:
          type: string
        idpLoginUrl:
          type: string
        idpLogoutUrl:
          type: string
      title: BaseAuthenticationConfig
    FullAuthenticationConfig:
      allOf:
        - "$ref": "#/components/schemas/BaseAuthenticationConfig"
      type: object
      properties:
        certificate:
          type: string
        createNewUser:
          type: boolean
        identityId:
          type: string
        idpEntityId:
          type: string
      title: AuthenticationConfig
    LoginRequest:
      type: object
      properties:
        accountid:
          type: integer
        password:
          type: string
        username:
          type: string
      title: LoginRequest
    OPToken:
      type: object
      properties:
        accessToken:
          type: string
        credentialsExpired:
          type: boolean
        expires:
          type: integer
        subDomain:
          type: string
        userId:
          type: integer
      required:
        - accessToken
      title: OPToken
    ForgotPasswordRequest:
      type: object
      properties:
        username:
          type: string
      required:
        - username
      title: ForgotPasswordRequest
    SignupRequest:
      type: object
      required:
        - emailAddress
        - firstName
        - lastName
        - password
        - country
        - timezone
        - recaptchaToken
        - marketing
      properties:
        emailAddress:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        password:
          type: string
          description: a plain-text password
        country:
          type: string
          description: The user-selected country
        timezone:
          type: string
          description: The default user time zone. e.g. "America/Denver"
        recaptchaToken:
          type: string
          description: A ReCaptcha token generated by the front-end to be validated
            by the back-end
        marketing:
          "$ref": "#/components/schemas/SignupMarketingData"
    SignupMarketingData:
      type: object
      description: |
        Marketing data collected during signup. UTM and pricing fields will be provided based upon the user's
        journey to the signup portal.
      required:
        - Product_Demo_Requested__c
        - Receiving_Nurture_Emails__c
      properties:
        Product_Demo_Requested__c:
          type: boolean
        Receiving_Nurture_Emails__c:
          type: boolean
        uTMSource:
          type: string
        uTMMedium:
          type: string
        uTMCampaign:
          type: string
        uTMTerm:
          type: string
        uTMContent:
          type: string
        Pricing_Page_Audit_Volume__c:
          type: integer
        Pricing_Page_Journey_Package__c:
          type: integer
        Pricing_Page_VPN__c:
          type: boolean
        Pricing_Page_SSO__c:
          type: boolean
    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
        newPassword:
          type: string
      required:
        - token
        - newPassword
      title: ResetPasswordRequest
    ArrayOfUsers:
      type: array
      items:
        "$ref": "#/components/schemas/User"
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        firstName:
          type: string
        lastName:
          type: string
        userName:
          type: string
